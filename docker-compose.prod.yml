version: '3.8'

services:
  quantux-servicedesk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantux-servicedesk-prod
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    volumes:
      - quantux_prod_data:/app/backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  quantux_prod_data:
    driver: local
